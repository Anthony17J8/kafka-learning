# ---------------------------------------------------------------------------
# Этап 0 / 1: одиночный брокер Kafka 4.x в режиме KRaft (без ZooKeeper).
# Роль ноды - combined: broker + controller в одном процессе.
# Годится для локальной разработки, НЕ для продакшена.
#
# Запуск:  docker compose -f docker/single-broker.yml up -d
# Стоп:    docker compose -f docker/single-broker.yml down
# Стоп+данные: docker compose -f docker/single-broker.yml down -v
# ---------------------------------------------------------------------------
name: kafka-learn-single

services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    hostname: kafka
    ports:
      # Порт для клиентов, запущенных на хосте (наши Java-приложения)
      - "9092:9092"
    environment:
      # --- Идентичность ноды -------------------------------------------------
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Формат: {nodeId}@{host}:{port}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # --- Листенеры ---------------------------------------------------------
      # PLAINTEXT      - для клиентов внутри docker-сети (другие контейнеры)
      # PLAINTEXT_HOST - для клиентов с хост-машины (localhost:9092)
      # CONTROLLER     - внутренний канал KRaft-кворума
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Настройки под одиночную ноду --------------------------------------
      # На одном брокере репликация выше 1 невозможна
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Автосоздание топиков выключено намеренно: учимся создавать явно
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Веб-UI для просмотра топиков, сообщений, консьюмер-групп.
  # http://localhost:8080
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-single
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  kafka-data:
