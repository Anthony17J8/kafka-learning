# ---------------------------------------------------------------------------
# Этапы 4, 6, 8, 9: полный стек.
#   3 брокера KRaft + Schema Registry + Kafka Connect (Debezium) +
#   Postgres + Prometheus + Grafana + Kafka UI
#
# ВНИМАНИЕ: это тяжёлый стек (~5-6 ГБ RAM). Поднимайте профилями:
#   docker compose -f docker/full-stack.yml --profile core up -d
#   docker compose -f docker/full-stack.yml --profile connect up -d
#   docker compose -f docker/full-stack.yml --profile monitoring up -d
#   docker compose -f docker/full-stack.yml --profile all up -d
#
# Перед первым запуском с профилем monitoring выполните:
#   ./scripts/download-jmx-exporter.sh
# ---------------------------------------------------------------------------
name: kafka-learn-full

x-kafka-common: &kafka-common
  image: apache/kafka:4.0.0
  profiles: ["core", "connect", "monitoring", "all"]
  environment: &kafka-common-env
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    # JMX-агент Prometheus навешивается через KAFKA_OPTS (см. jmx-exporter/)
    KAFKA_OPTS: "-javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent.jar=7071:/opt/jmx-exporter/kafka-broker.yml"
  healthcheck:
    test: ["CMD-SHELL", "KAFKA_OPTS='' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 15
    start_period: 25s

services:
  # ======================= CORE: Kafka cluster ============================
  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    hostname: kafka-1
    ports: ["19092:9092", "17071:7071"]
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://kafka-1:19093,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka-1:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:19093,PLAINTEXT_HOST://localhost:19092
    volumes:
      - kafka-1-data:/var/lib/kafka/data
      - ./jmx-exporter:/opt/jmx-exporter:ro

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    hostname: kafka-2
    ports: ["29092:9092", "27071:7071"]
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://kafka-2:19093,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka-2:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:19093,PLAINTEXT_HOST://localhost:29092
    volumes:
      - kafka-2-data:/var/lib/kafka/data
      - ./jmx-exporter:/opt/jmx-exporter:ro

  kafka-3:
    <<: *kafka-common
    container_name: kafka-3
    hostname: kafka-3
    ports: ["39092:9092", "37071:7071"]
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://kafka-3:19093,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka-3:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:19093,PLAINTEXT_HOST://localhost:39092
    volumes:
      - kafka-3-data:/var/lib/kafka/data
      - ./jmx-exporter:/opt/jmx-exporter:ro

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    profiles: ["core", "connect", "monitoring", "all"]
    depends_on:
      kafka-1: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local-full
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19093,kafka-2:19093,kafka-3:19093
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"

  # ======================= Schema Registry (этап 4) =======================
  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.0
    container_name: schema-registry
    profiles: ["core", "connect", "all"]
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:19093,kafka-2:19093,kafka-3:19093
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ======================= Kafka Connect (этап 6) =========================
  postgres:
    image: postgres:16
    container_name: postgres
    profiles: ["connect", "all"]
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: kafka
      POSTGRES_PASSWORD: kafka
      POSTGRES_DB: shop
    # wal_level=logical обязателен для Debezium CDC
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../06-kafka-connect/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kafka -d shop"]
      interval: 10s
      timeout: 5s
      retries: 10

  connect:
    # Образ Debezium уже содержит коннекторы Postgres/MySQL/MongoDB
    image: debezium/connect:3.0.0.Final
    container_name: connect
    profiles: ["connect", "all"]
    depends_on:
      kafka-1: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
      postgres: { condition: service_healthy }
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka-1:19093,kafka-2:19093,kafka-3:19093
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 3
      OFFSET_STORAGE_REPLICATION_FACTOR: 3
      STATUS_STORAGE_REPLICATION_FACTOR: 3
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      ENABLE_DEBEZIUM_SCRIPTING: "true"
    volumes:
      # Сюда можно докидывать сторонние коннекторы (JDBC sink, Elasticsearch...)
      - ./connect/plugins:/kafka/connect/custom
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ======================= Monitoring (этап 9) ============================
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    profiles: ["monitoring", "all"]
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.5.0
    container_name: grafana
    profiles: ["monitoring", "all"]
    depends_on: [prometheus]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../09-operations-monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  # ======================= ksqlDB (этап 8, опционально) ===================
  ksqldb:
    image: confluentinc/ksqldb-server:0.29.0
    container_name: ksqldb
    profiles: ["ksql", "all"]
    depends_on:
      kafka-1: { condition: service_healthy }
    ports: ["8088:8088"]
    environment:
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_BOOTSTRAP_SERVERS: kafka-1:19093,kafka-2:19093,kafka-3:19093
      KSQL_KSQL_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: "true"
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: "true"

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  postgres-data:
  prometheus-data:
  grafana-data:
