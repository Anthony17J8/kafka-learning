global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'kafka-brokers'
    static_configs:
      - targets:
          - 'kafka-1:7071'
          - 'kafka-2:7071'
          - 'kafka-3:7071'
        labels:
          cluster: 'local-full'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
